<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ubah Kata Sandi - ProjekAdita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/styles/tokens.css">
  <link rel="stylesheet" href="/shared/styles/base.css">
  <link rel="stylesheet" href="/shared/styles/components.css">
  <script type="module" src="/app/pages/change-password/change-password.js"></script>
</head>
<body>
  <a class="skip" href="#main">Lewati ke konten</a>
  <div id="shell"></div>

  <div class="app-layout">
    <aside id="sidebar" class="sidebar" aria-label="Menu navigasi"></aside>

    <main class="page" id="main" tabindex="-1">
      <noscript><p class="notice">Halaman ini membutuhkan JavaScript.</p></noscript>
      <div id="notification" class="notice" role="status" hidden></div>

      <section class="panel" aria-labelledby="password-title">
        <h1 id="password-title">Ubah Kata Sandi</h1>
        <p class="field-hint">Setelah diganti, perangkat lain yang sedang masuk akan keluar otomatis.</p>

        <form id="password-form" novalidate>
          <p id="form-message" class="notice" role="alert"></p>
          <div class="field">
            <label for="currentPassword">Kata sandi saat ini</label>
            <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required aria-describedby="currentPassword-error">
            <p id="currentPassword-error" class="field-error"></p>
          </div>
          <div class="field">
            <label for="newPassword">Kata sandi baru</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required aria-describedby="newPassword-error">
            <p id="newPassword-error" class="field-error"></p>
          </div>
          <div class="field">
            <label for="confirmNewPassword">Konfirmasi kata sandi baru</label>
            <input id="confirmNewPassword" name="confirmNewPassword" type="password" autocomplete="new-password" required aria-describedby="confirmNewPassword-error">
            <p id="confirmNewPassword-error" class="field-error"></p>
          </div>
          <div class="panel-actions">
            <button class="btn" type="submit">Ubah kata sandi</button>
            <a class="btn btn--ghost" href="/profile">Kembali ke profil</a>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
