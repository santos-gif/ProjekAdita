<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset kata sandi - Campus Collab</title>
  <link rel="stylesheet" href="/shared/styles/tokens.css">
  <link rel="stylesheet" href="/shared/styles/base.css">
  <link rel="stylesheet" href="/shared/styles/components.css">
  <link rel="stylesheet" href="/app/pages/reset/reset.css">
  <script type="module" src="/app/pages/reset/reset.js"></script>
</head>
<body class="auth-page">
  <a class="skip" href="#main">Lewati ke konten</a>
  <header class="brand-bar"><a class="brand" href="/">Campus Collab</a></header>
  <main class="auth-main" id="main" tabindex="-1">
    <div class="auth-card">
      <h1><span class="title-underline">Reset kata sandi</span></h1>
      <noscript><p class="notice">Halaman ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</p></noscript>
      <form id="reset-form" novalidate>
        <p id="form-message" class="notice" role="alert"></p>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
          <p id="email-error" class="field-error"></p>
        </div>
        <div class="field">
          <label for="newPassword">Kata sandi baru</label>
          <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required aria-describedby="newPassword-error">
          <p id="newPassword-error" class="field-error"></p>
        </div>
        <div class="field">
          <label for="confirmPassword">Konfirmasi kata sandi baru</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required aria-describedby="confirmPassword-error">
          <p id="confirmPassword-error" class="field-error"></p>
        </div>
        <button class="btn btn--block" type="submit">Reset kata sandi</button>
      </form>
      <p class="alt"><a class="link-pad" href="/login">Kembali ke halaman masuk</a></p>
    </div>
  </main>
</body>
</html>
