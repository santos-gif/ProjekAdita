<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laporan - ProjekAdita</title>
  <link rel="stylesheet" href="/shared/styles/tokens.css">
  <link rel="stylesheet" href="/shared/styles/base.css">
  <link rel="stylesheet" href="/shared/styles/components.css">
  <script type="module" src="/app/pages/reports/reports.js"></script>
</head>
<body>
  <a class="skip" href="#main">Lewati ke konten</a>
  <div id="shell"></div>
  <div class="app-layout">
    <aside id="sidebar" class="sidebar" aria-label="Menu navigasi"></aside>
    <main class="page" id="main" tabindex="-1">
      <noscript><p class="notice">Halaman ini membutuhkan JavaScript.</p></noscript>
      <div id="notification" class="notice" role="status" hidden></div>
      <h1>Laporan proyek</h1>
      <div class="toolbar">
        <div class="field">
          <label for="status">Status</label>
          <select id="status">
            <option value="open">Terbuka</option>
            <option value="forwarded">Diteruskan ke admin</option>
            <option value="dismissed">Diabaikan</option>
            <option value="actioned">Ditindak</option>
            <option value="all">Semua</option>
          </select>
        </div>
      </div>
      <div id="list" class="item-list"></div>
    </main>
  </div>
</body>
</html>
