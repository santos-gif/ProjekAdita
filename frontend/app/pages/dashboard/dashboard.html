<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - ProjekAdita</title>
  <link rel="stylesheet" href="/shared/styles/tokens.css">
  <link rel="stylesheet" href="/shared/styles/base.css">
  <link rel="stylesheet" href="/shared/styles/components.css">
  <link rel="stylesheet" href="/app/pages/dashboard/dashboard.css">
  <script type="module" src="/app/pages/dashboard/dashboard.js"></script>
</head>
<body>
  <a class="skip" href="#main">Lewati ke konten</a>
  <div id="shell"></div>
  <main class="page" id="main" tabindex="-1">
    <noscript><p class="notice">Dashboard membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</p></noscript>
    <p id="status" class="notice" role="status">Memuat dashboard...</p>
    <section id="content" aria-labelledby="title" hidden>
      <h1 id="title"></h1>
      <h2><span class="title-underline">Proyek</span></h2>
      <div class="empty">
        <h3>Belum ada proyek</h3>
        <p>Proyek yang kamu buat atau ikuti akan tampil di sini. Fitur proyek akan hadir pada rilis berikutnya.</p>
        <button class="btn" type="button" aria-disabled="true">Tambah proyek (segera hadir)</button>
      </div>
    </section>
  </main>
</body>
</html>
