<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - ProjekAdita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/styles/tokens.css">
  <link rel="stylesheet" href="/shared/styles/base.css">
  <link rel="stylesheet" href="/shared/styles/components.css">
  <link rel="stylesheet" href="/app/pages/dashboard/dashboard.css">
  <script type="module" src="/app/pages/dashboard/dashboard.js"></script>
</head>
<body>
  <a class="skip" href="#main">Lewati ke konten</a>
  <div id="shell"></div>
  <div class="app-layout">
    <aside id="sidebar" class="sidebar" aria-label="Menu navigasi"></aside>
    <main class="page" id="main" tabindex="-1">
      <noscript><p class="notice">Dashboard membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</p></noscript>
      <div id="notification" class="notice" role="status" hidden></div>
      <h1 id="title"></h1>
      <div class="item-actions">
        <a class="btn" href="/add-project">Tambah proyek</a>
        <a class="btn btn--ghost" href="/discover">Jelajahi proyek</a>
      </div>
      <div id="content" class="detail"></div>
    </main>
  </div>
</body>
</html>
