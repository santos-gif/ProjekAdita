<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar - ProjekAdita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/styles/tokens.css">
  <link rel="stylesheet" href="/shared/styles/base.css">
  <link rel="stylesheet" href="/shared/styles/components.css">
  <link rel="stylesheet" href="/app/pages/register/register.css">
  <script type="module" src="/app/pages/register/register.js"></script>
</head>
<body class="auth-page">
  <a class="skip" href="#main">Lewati ke konten</a>
  <header class="brand-bar"><a class="brand" href="/">ProjekAdita</a></header>
  <main class="auth-main" id="main" tabindex="-1">
    <div class="auth-card">
      <h1><span class="title-underline">Buat akun</span></h1>
      <noscript><p class="notice">Halaman ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda untuk mendaftar.</p></noscript>
      <form id="register-form" novalidate>
        <p id="form-message" class="notice" role="alert"></p>
        <div class="field">
          <label for="name">Nama lengkap</label>
          <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-error">
          <p id="name-error" class="field-error"></p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
          <p id="email-error" class="field-error"></p>
        </div>
        <div class="field">
          <label for="password">Kata sandi (minimal 8 karakter)</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="password-error">
          <p id="password-error" class="field-error"></p>
        </div>
        <div class="field">
          <label for="confirmPassword">Konfirmasi kata sandi</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" aria-describedby="confirmPassword-error">
          <p id="confirmPassword-error" class="field-error"></p>
        </div>
        <button class="btn btn--block" type="submit">Daftar</button>
      </form>
      <p class="alt">Sudah punya akun? <a class="link-pad" href="/login">Masuk</a></p>
    </div>
  </main>
</body>
</html>
