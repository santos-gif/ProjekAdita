server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'" always;

  # The API lives in another container; proxying it keeps one origin for the browser (cookies + CSRF).
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Clean URLs: /login serves app/pages/login/login.html, and so on.
  location ~ ^/(login|register|reset|dashboard)/?$ {
    expires -1;
    try_files /app/pages/$1/$1.html =404;
  }

  # Build files that end up in the web root must not be downloadable.
  location ~ ^/(Dockerfile|nginx\.conf|\.dockerignore)$ {
    return 404;
  }

  location = /favicon.ico {
    return 204;
  }

  # expires -1 sends "Cache-Control: no-cache", so browsers re-check files and edits show without a hard refresh.
  location / {
    expires -1;
    try_files $uri $uri/ =404;
  }
}
