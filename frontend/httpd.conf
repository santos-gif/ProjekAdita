# Apache for the frontend container (replaces nginx). Serves the pages, forwards /api to the api container,
# and serves the thumbnails from the shared "uploads" volume.
ServerRoot "/usr/local/apache2"
Listen 8080
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable off

# Apache starts as root, then runs as "daemon" (the compose file keeps only the SETUID/SETGID capabilities).
User daemon
Group daemon
# The root filesystem is read-only; /tmp is a tmpfs.
PidFile /tmp/httpd.pid
DefaultRuntimeDir /tmp

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule headers_module modules/mod_headers.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common

TypesConfig conf/mime.types
AddType text/javascript .js .mjs

DocumentRoot "/usr/local/apache2/htdocs"
DirectoryIndex index.html

<Directory />
    AllowOverride None
    Require all denied
</Directory>

# Files from the build folder that end up in the web root must not be downloadable.
<FilesMatch "^(Dockerfile|httpd\.conf|\.dockerignore)$">
    Require all denied
</FilesMatch>

# "no-cache" makes browsers re-check files, so edits show without a hard refresh.
<Directory "/usr/local/apache2/htdocs">
    Options -Indexes
    AllowOverride None
    Require all granted
    Header set Cache-Control "no-cache"
</Directory>

Header always set X-Content-Type-Options nosniff
Header always set X-Frame-Options DENY
Header always set Referrer-Policy same-origin
Header always set Content-Security-Policy "default-src 'self'"

# Project thumbnails: the api container writes them to the "uploads" volume, mounted here read-only.
# Their names are random and never reused, so the browser may keep them for 30 days.
Alias /uploads/ /uploads/
<Directory "/uploads">
    Options -Indexes
    AllowOverride None
    Require all granted
    Header set Cache-Control "max-age=2592000"
</Directory>

# The API lives in another container; proxying it keeps one origin for the browser (cookies + CSRF).
# Thumbnails travel inside the JSON body as base64 (a 2 MB image is about 2.7 MB), so allow 4 MB here.
ProxyPreserveHost On
ProxyPass /api/ http://api:8080/api/
ProxyPassReverse /api/ http://api:8080/api/
<Location "/api/">
    LimitRequestBody 4194304
    # Request::ip() trusts the first X-Forwarded-For entry. Drop what the visitor sent;
    # mod_proxy then adds the real peer address.
    RequestHeader unset X-Forwarded-For
</Location>

RewriteEngine On
# Clean URLs: /login serves app/pages/login/login.html, and so on.
RewriteRule ^/(login|register|reset|dashboard|projek-saya|add-project|profile|change-password|discover|project|joined|applications|review|reports|users|user)/?$ /app/pages/$1/$1.html [L]
RewriteRule ^/favicon\.ico$ - [R=204,L]
