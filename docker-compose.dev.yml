# Standalone, for development: PHP and frontend edits show up without rebuilding.
#   docker compose -f docker-compose.dev.yml --env-file .env.dev up --build
#   docker compose -f docker-compose.dev.yml --env-file .env.dev down
# Needs .env.dev with DB_NAME, DB_USER, DB_PASS, DB_HOST_PORT (host port for the database) and API_PORT.
# Own project name, so its database volume never mixes with the one from docker-compose.yml.
name: projekadita-dev

services:
  # Database (MariaDB), published on this machine so a GUI client can connect to 127.0.0.1:${DB_HOST_PORT}.
  db:
    image: mariadb:11.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_NAME:?set DB_NAME in .env.dev}
      MARIADB_USER: ${DB_USER:?set DB_USER in .env.dev}
      MARIADB_PASSWORD: ${DB_PASS:?set DB_PASS in .env.dev}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${DB_HOST_PORT:?set DB_HOST_PORT in .env.dev}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # API (PHP + Apache). The PHP code is mounted from your folders, so saving a file is enough.
  api:
    build: ./backend
    environment:
      APP_ENV: development
      APP_COOKIE_SECURE: "0"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?set DB_NAME in .env.dev}
      DB_USER: ${DB_USER:?set DB_USER in .env.dev}
      DB_PASS: ${DB_PASS:?set DB_PASS in .env.dev}
    ports:
      - "127.0.0.1:${API_PORT:?set API_PORT in .env.dev}:8080"
    volumes:
      # bind mounts: these folders from your computer appear inside the container
      - ./backend/index.php:/var/www/app/index.php:ro
      - ./backend/Core:/var/www/app/Core:ro
      - ./backend/Features:/var/www/app/Features:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/api/v1/health') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Website (nginx), using the stock image: pages and nginx.conf are mounted from frontend/.
  # After editing frontend/nginx.conf run: docker compose -f docker-compose.dev.yml --env-file .env.dev restart frontend
  frontend:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  db_data:
