# Contoh vhost. Ganti /path/to/ProjekAdita dengan path proyek (mis. C:/School-Projects/ProjekAdita).
# Butuh mod_rewrite. Di Docker cukup mount proyek ke path yang sama.
<VirtualHost *:80>
    ServerName campus-collab.local
    DocumentRoot "/path/to/ProjekAdita/frontend"

    Alias /api "/path/to/ProjekAdita/backend"

    <Directory "/path/to/ProjekAdita/frontend">
        AllowOverride All
        Require all granted
    </Directory>

    # Deny by default; only index.php is reachable (rewrite sends /api/... there).
    # database/ and every other file here is never served.
    <Directory "/path/to/ProjekAdita/backend">
        AllowOverride All
        Require all denied
        <Files "index.php">
            Require all granted
        </Files>
    </Directory>
</VirtualHost>
