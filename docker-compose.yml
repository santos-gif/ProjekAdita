# Default config: everything shared by all environments, with production-safe defaults.
# Variables come from an env file:
#   dev:  docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml up --build
#   prod: docker compose --env-file .env.prod up -d --build
name: projekadita

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging
  networks: [internal]

services:
  db:
    # MariaDB, not MySQL: the mysql:8.x images crash (mysqld segfault) under this Docker Desktop/WSL2 setup.
    image: mariadb:11.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_NAME:?set DB_NAME}
      MARIADB_USER: ${DB_USER:?set DB_USER}
      MARIADB_PASSWORD: ${DB_PASS:?set DB_PASS}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
      # imported only on the first start, while the volume is empty
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 1g

  api:
    <<: *hardening
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-1}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      db:
        condition: service_healthy
    # Apache starts as root and drops to www-data, hence SETUID/SETGID.
    cap_add: [SETUID, SETGID]
    tmpfs: [/tmp, /var/run/apache2, /var/lock/apache2]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/api/v1/health') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m

  frontend:
    <<: *hardening
    # compose cannot write the inline nginx config into a read-only rootfs; the site files are still mounted :ro
    read_only: false
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      api:
        condition: service_healthy
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64m

configs:
  nginx_conf:
    content: |
      server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'" always;

        location /api/ {
          proxy_pass http://api:8080;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-For $$remote_addr;
          proxy_set_header X-Forwarded-Proto $$scheme;
        }
        location ~ ^/(login|register|reset|dashboard)/?$$ {
          try_files /app/pages/$$1/$$1.html =404;
        }
        location = /favicon.ico { return 204; }
        location / { try_files $$uri $$uri/ =404; }
      }

networks:
  internal:

volumes:
  db_data:
