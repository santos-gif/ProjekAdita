# Standalone: this file works on its own.
#   docker compose up --build     build and start everything (variables are read from a file named .env)
#   docker compose down           stop and remove the containers (the database is kept; add -v to delete it too)
# First time: copy .env.example to .env, then set DB_NAME, DB_USER and DB_PASS.
# For development with live code editing use docker-compose.dev.yml instead.
name: projekadita

services:
  # Database (MariaDB). Not published to the host: only the api container can reach it.
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_NAME:?set DB_NAME in .env}
      MARIADB_USER: ${DB_USER:?set DB_USER in .env}
      MARIADB_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      # named volume: Docker-managed storage that keeps the data between restarts
      - db_data:/var/lib/mysql
      # imported only on the very first start, while the volume is still empty
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    deploy:
      resources:
        limits:
          memory: 1g

  # API (PHP + Apache), built from backend/Dockerfile. Only the frontend container talks to it.
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      # 1 = session cookie only over HTTPS (localhost counts). Set 0 in .env to use plain http on another host.
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-1}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?set DB_NAME in .env}
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASS: ${DB_PASS:?set DB_PASS in .env}
    depends_on:
      db:
        condition: service_healthy
    # lock-down: read-only filesystem (only the tmpfs folders are writable) and no extra privileges
    read_only: true
    tmpfs: [/tmp, /var/run/apache2, /var/lock/apache2]
    cap_drop: [ALL]
    # Apache starts as root and then switches to www-data, which needs these two.
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/api/v1/health') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    deploy:
      resources:
        limits:
          memory: 256m

  # Website (nginx), built from frontend/Dockerfile. Serves the pages and forwards /api to the api container.
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      # only this machine can open it; put an HTTPS reverse proxy in front for real use
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  db_data:
